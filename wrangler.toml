name = "ntut-drone-web"
main = "src/worker.js"
compatibility_date = "2024-05-02"

# Modern Static Assets Hosting (Wrangler 3+)
[assets]
directory = "./public"

[[kv_namespaces]]
binding = "DRONE_DB"
id = "YOUR_KV_NAMESPACE_ID" # Replace with your Cloudflare KV Namespace ID after creation

[[durable_objects.bindings]]
name = "EQUIPMENT_STORE"
class_name = "EquipmentStore"

[[durable_objects.bindings]]
name = "FORM_STORE"
class_name = "FormStore"

[[durable_objects.bindings]]
name = "SITE_STORE"
class_name = "SiteStore"

[[durable_objects.bindings]]
name = "MEETING_STORE"
class_name = "MeetingStore"

[[durable_objects.bindings]]
name = "MESSAGE_STORE"
class_name = "MessageStore"

[[durable_objects.bindings]]
name = "FILE_STORE"
class_name = "FileStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EquipmentStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FormStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SiteStore"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["MeetingStore"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["MessageStore"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["FileStore"]

# File library (檔案庫): photos and documents are stored in this R2 bucket. See README「檔案庫」.
[[r2_buckets]]
binding = "FILES"
bucket_name = "your-r2-bucket-name" # Replaced from the CLOUDFLARE_R2_BUCKET GitHub secret by deploy.yml

# Weekly club report: every Monday 01:00 UTC (09:00 Taipei). See README「AI 功能」.
[triggers]
crons = ["0 1 * * 1"]
