name: Deploy NTUT Drone Website to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Inject KV Namespace ID
        run: |
          KV_ID=$(echo "${{ secrets.CLOUDFLARE_KV_ID }}" | tr -d '[:space:]')
          if [ -z "$KV_ID" ]; then
            echo "::error::CLOUDFLARE_KV_ID secret is not set in GitHub Repository Secrets! Please add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          sed -i "s/YOUR_KV_NAMESPACE_ID/$KV_ID/g" wrangler.toml
          echo "KV Namespace ID successfully injected."

      # `wrangler deploy` fails when a bound R2 bucket does not exist or the token cannot use R2.
      # Create missing buckets (R2 buckets are private by default) and stop with a clear message otherwise.
      - name: Ensure R2 buckets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUCKETS=$(sed -n 's/^bucket_name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' wrangler.toml)
          [ -z "$BUCKETS" ] && exit 0
          EXISTING=$(npx wrangler r2 bucket list) || { echo "::error::Cannot list R2 buckets. Give CLOUDFLARE_API_TOKEN the 'Workers R2 Storage: Edit' permission (see README 3-3-1)."; exit 1; }
          for BUCKET in $BUCKETS; do
            if echo "$EXISTING" | grep -qE "^name:[[:space:]]+$BUCKET\$"; then
              echo "R2 bucket $BUCKET exists."
            else
              echo "Creating private R2 bucket $BUCKET."
              if ! OUTPUT=$(npx wrangler r2 bucket create "$BUCKET" 2>&1); then
                echo "$OUTPUT"
                echo "$OUTPUT" | grep -qi "already exists" || { echo "::error::Could not create R2 bucket $BUCKET. Create it in the Cloudflare dashboard (keep it private) and check the token's R2 permission."; exit 1; }
              fi
            fi
          done

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Lets the Desktop App workflow announce each automatic release to the website
      # (PUT /api/desktop/version). Optional: skipped when the GitHub secret is not set.
      - name: Sync desktop release token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DESKTOP_RELEASE_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: |
          if [ -z "$DESKTOP_RELEASE_TOKEN" ]; then
            echo "DESKTOP_RELEASE_TOKEN is not set; desktop releases must be announced by the president in the program."
            exit 0
          fi
          if [ ${#DESKTOP_RELEASE_TOKEN} -lt 32 ]; then
            echo "::warning::DESKTOP_RELEASE_TOKEN must be at least 32 characters; not installed."
            exit 0
          fi
          printf '%s' "$DESKTOP_RELEASE_TOKEN" | npx wrangler secret put DESKTOP_RELEASE_TOKEN
