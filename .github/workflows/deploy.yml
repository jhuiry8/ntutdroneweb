name: Deploy NTUT Drone Website to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Inject KV Namespace ID
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_KV_ID }}" ]; then
            echo "::error::CLOUDFLARE_KV_ID secret is not set in GitHub Repository Secrets! Please add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          sed -i 's/YOUR_KV_NAMESPACE_ID/${{ secrets.CLOUDFLARE_KV_ID }}/g' wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
