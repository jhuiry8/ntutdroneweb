name: Android App (APK build)

# Builds Android APK on every change to android/ or manual trigger.
# Pushing a tag such as android-v1.0.0 automatically creates a GitHub Release
# with the downloadable APKs attached.
on:
  push:
    branches: [ main ]
    tags: [ 'android-v*' ]
  pull_request:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    # Tagged releases are signed with the club's long-lived key so every new version
    # installs over the previous one. Debug builds use a throwaway key per runner.
    - name: Build signed release APK
      if: startsWith(github.ref, 'refs/tags/android-v')
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret; refusing to publish an APK signed with a temporary debug key."
          exit 1
        fi
        export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
        cd android
        ./gradlew assembleRelease --stacktrace

    - name: Prepare APK outputs
      run: |
        mkdir -p dist/apk
        cp android/app/build/outputs/apk/debug/app-debug.apk dist/apk/NTUT-Drone-Club-Debug.apk
        if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
          cp android/app/build/outputs/apk/release/app-release.apk dist/apk/NTUT-Drone-Club.apk
        fi
        echo "Built APK files:"
        ls -la dist/apk/

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: NTUT-Drone-Club-APK
        path: dist/apk/*.apk
        retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: NTUT-Drone-Club-APK
        path: dist/apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: 北科無人機社 Android App ${{ github.ref_name }}
        files: dist/apk/NTUT-Drone-Club.apk
        body: |
          ### 📱 北科無人機社 Android APK 安裝包 (${{ github.ref_name }})

          此版本為國立臺北科技大學無人機社官方 Android 原生 App，支援：
          - 📢 社內公告（需登入）
          - 🗳️ 會議列表與簽到碼簽到（需登入）
          - 🛸 設備清單（幹部）與線上借用表單
          - 🔄 下拉重新整理 (Pull-to-Refresh)

          **安裝說明**：
          1. 下載下方 `NTUT-Drone-Club.apk`。
          2. 在 Android 手機點擊安裝（若出現未驗證來源提示，請選擇「允許來自此來源的安裝」）。
          3. 開啟即可登入使用！
