name: Desktop App (Windows build)

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt pyinstaller

    - name: Run unit tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover -s tests -v

    - name: Build ClubDesk.exe
      run: >-
        pyinstaller --noconfirm --onefile --windowed --name ClubDesk
        --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
        --exclude-module PySide6.QtPdf main.py

    - name: Upload program
      uses: actions/upload-artifact@v4
      with:
        name: ClubDesk-windows
        path: desktop/dist/ClubDesk.exe
