name: Desktop App (Windows installer)

# Builds and tests ClubDesk-Setup-x.y.z.exe.
#   * Pull requests and manual runs only build and test (the installer is a workflow artifact).
#   * Merges to main are released by release.yml, which calls this workflow with the version
#     number to use and publishes ONE GitHub Release with every package.
on:
  pull_request:
    branches: [ main, develop ]
    paths: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to build (x.y.z), chosen by release.yml
        type: string
        required: true
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      sha256:
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

# A newer pull request push replaces the older run.
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt pyinstaller

    - name: Run unit tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m unittest discover -s tests -v

    - name: Choose version
      id: version
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        $base = python -c "from clubdesk import __version__; print(__version__)"
        $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { $base }
        if ($version -notmatch '^\d{1,4}\.\d{1,4}\.\d{1,4}$') { throw "Invalid version '$version'" }
        # The program reports this number to the update check, so it must match the release.
        (Get-Content clubdesk/__init__.py -Raw) -replace '__version__ = "[^"]*"', "__version__ = `"$version`"" | Set-Content clubdesk/__init__.py -NoNewline -Encoding utf8
        "Version $version (source $base)"
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Build program folder
      run: pyinstaller --noconfirm ClubDesk.spec

    - name: Build installer
      run: |
        if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
        }
        iscc /DAppVersion=${{ steps.version.outputs.version }} installer\ClubDesk.iss

    - name: Report size and checksum
      id: setup
      run: |
        $file = Get-Item "dist\ClubDesk-Setup-${{ steps.version.outputs.version }}.exe"
        $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
        $folder = (Get-ChildItem dist\ClubDesk -Recurse -File | Measure-Object Length -Sum).Sum
        "Installer: {0:N1} MB, installed size: {1:N1} MB, SHA-256: {2}" -f ($file.Length / 1MB), ($folder / 1MB), $hash
        if ($file.Length -gt 50MB) { throw "Installer is larger than 50 MB" }
        "sha256=$hash" >> $env:GITHUB_OUTPUT

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: ClubDesk-Setup-${{ steps.version.outputs.version }}
        path: desktop/dist/ClubDesk-Setup-*.exe

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.setup.outputs.sha256 }}

