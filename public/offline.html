<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>離線模式 | 北科無人機社 NTUT Drone Club</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
            box-sizing: border-box;
            padding: 24px;
        }
        .offline-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .offline-icon {
            font-size: 54px;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 12px;
            font-weight: 700;
            color: #ffffff;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #94a3b8;
            margin: 0 0 24px;
        }
        .btn-retry {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        .btn-retry:hover, .btn-retry:active {
            background: #1d4ed8;
        }
        .offline-tip {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">🛸</div>
        <h1>目前處於離線狀態</h1>
        <p>您的裝置似乎尚未連上網際網路。請檢查 Wi-Fi 或行動網路連線後，點擊下方按鈕重試。</p>
        <button class="btn-retry" onclick="window.location.reload()">重新連線</button>
        <div class="offline-tip">北科無人機社 NTUT Drone Club · 行動離線快取</div>
    </div>
</body>
</html>
